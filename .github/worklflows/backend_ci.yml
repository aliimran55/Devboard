name: DevBoard Backend CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install

      - name: TypeScipt überprüfen
        run: npx tsc --noEmit
