trigger:
- main

variables:
  - group: ghcr-credentials

stages:
- stage: Build
  displayName: 'Build und Images veröffentlichen'
  jobs:
  - job: BuildAndPush
    displayName: 'Build und Push auf GHCR'
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: NodeTool@0
      displayName: 'Node.js einrichten'
      inputs:
        versionSpec: '22.x'

    - script: npm install
      displayName: 'Backend Abhängigkeiten installieren'
      workingDirectory: backend

    - script: npx tsc --noEmit
      displayName: 'TypeScript überprüfen'
      workingDirectory: backend

    - script: docker compose build
      displayName: 'Docker-Images bauen'

    - script: |
        echo "$GHCR_TOKEN" | docker login ghcr.io \
          --username "$GHCR_USERNAME" \
          --password-stdin
      displayName: 'Bei GitHub Container Registry anmelden'
      env:
        GHCR_USERNAME: $(GHCR_USERNAME)
        GHCR_TOKEN: $(GHCR_TOKEN)

    - script: docker compose push
      displayName: 'Docker-Images veröffentlichen'

- stage: TestMacAgent
  displayName: 'Mac-Agent testen'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: CheckMac
    displayName: 'Docker auf dem Mac prüfen'
    pool:
      name: Devboard Mac

    steps:
    - script: |
        echo "Hostname:"
        hostname

        echo ""
        echo "Docker-Version:"
        docker --version

        echo ""
        echo "Docker Compose-Version:"
        docker compose version
      displayName: 'Mac-Agent und Docker prüfen'