trigger:
- main

variables:
  - group: ghcr-credentials

stages:
- stage: Build
  displayName: 'Build und Images veröffentlichen'
  jobs:
  - job: BuildAndPush
    displayName: 'Build und Push auf GHCR'
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: NodeTool@0
      displayName: 'Node.js einrichten'
      inputs:
        versionSpec: '22.x'

    - script: npm install
      displayName: 'Backend Abhängigkeiten installieren'
      workingDirectory: backend

    - script: npx tsc --noEmit
      displayName: 'TypeScript überprüfen'
      workingDirectory: backend

    - script: docker compose build
      displayName: 'Docker-Images bauen'

    - script: |
        echo "$GHCR_TOKEN" | docker login ghcr.io \
          --username "$GHCR_USERNAME" \
          --password-stdin
      displayName: 'Bei GitHub Container Registry anmelden'
      env:
        GHCR_USERNAME: $(GHCR_USERNAME)
        GHCR_TOKEN: $(GHCR_TOKEN)

    - script: docker compose push
      displayName: 'Docker-Images veröffentlichen'

- stage: Deploy
  displayName: 'App auf dem Mac deployen'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployToMac
    displayName: 'Devboard aktualisieren'
    pool:
      name: Devboard Mac

    steps:
    - checkout: self

    - script: |
        set -e

        echo "Docker-Version:"
        docker --version

        echo "Docker Compose-Version:"
        docker compose version

        echo "GHCR-Anmeldung:"
        echo "$GHCR_TOKEN" | docker login ghcr.io \
          --username "$GHCR_USERNAME" \
          --password-stdin

        echo "Neue Images herunterladen:"
        docker compose -p devboard pull

        echo "App aktualisieren:"
        docker compose -p devboard up -d

        echo "Containerstatus:"
        docker compose -p devboard ps
      displayName: 'Images herunterladen und App aktualisieren'
      env:
        GHCR_USERNAME: $(GHCR_USERNAME)
        GHCR_TOKEN: $(GHCR_TOKEN)