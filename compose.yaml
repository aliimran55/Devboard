services:
  frontend:
    image: ghcr.io/aliimran55/devboard-frontend:latest
    build: ./frontend
    ports: 
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: ghcr.io/aliimran55/devboard-backend:latest
    build: ./backend
    ports: 
      - "8080:80"
    volumes:
      - ./backend:/devboard.db:/app/devboard.db