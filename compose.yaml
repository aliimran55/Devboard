services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/aliimran55/devboard-backend:latest
    ports:
      - "8080:3000"
    environment:
      DB_PATH: /data/devboard.db
    volumes:
      - devboard-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/aliimran55/devboard-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  devboard-data: