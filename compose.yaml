services:
  frontend:
    image: ghcr.io/aliimran55/devboard-frontend:latest
    build: ./frontend
    ports: 
      - "3000:80"
    depends_on:
      - backend

backend:
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: ghcr.io/aliimran55/devboard-backend:latest
  ports:
    - "8080:3000"
  volumes:
    - /Users/macbook/devboard-data/devboard.db:/app/devboard.db